<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mock Roblox</title>
<style>
  :root {
    --bg: #0e1117; --panel: #161b24; --line: #2a3240; --ink: #e6edf3;
    --dim: #8b98a9; --accent: #4da3ff; --good: #3fb950; --bad: #f85149; --warn: #d29922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: grid; grid-template-columns: 1fr 300px; height: 100vh; overflow: hidden;
  }
  #stage { position: relative; }
  canvas { display: block; width: 100%; height: 100%; }
  #badge {
    position: absolute; top: 12px; left: 16px; padding: 6px 12px; border-radius: 6px;
    background: rgba(22,27,36,.9); border: 1px solid var(--line); font-size: 12px;
  }
  #badge b { color: var(--accent); }
  .off { color: var(--bad); } .on { color: var(--good); }
  aside {
    background: var(--panel); border-left: 1px solid var(--line);
    padding: 16px; overflow-y: auto;
  }
  h1 { font-size: 13px; margin: 0 0 4px; letter-spacing: .08em; text-transform: uppercase; }
  h2 {
    font-size: 11px; margin: 20px 0 8px; color: var(--dim);
    letter-spacing: .08em; text-transform: uppercase;
  }
  .sub { color: var(--dim); font-size: 11px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td { padding: 2px 0; }
  td:last-child { text-align: right; color: var(--dim); }
  button {
    width: 100%; margin-bottom: 6px; padding: 7px 10px; border-radius: 5px;
    border: 1px solid var(--line); background: #1d2430; color: var(--ink);
    font: inherit; font-size: 12px; cursor: pointer; text-align: left;
    display: flex; justify-content: space-between;
  }
  button:hover:not(:disabled) { border-color: var(--accent); background: #222c3a; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button span { color: var(--dim); }
  #kill { border-color: #5a2a2a; background: #2a1a1a; }
  #kill:hover:not(:disabled) { border-color: var(--bad); }
  #active:empty::after { content: "none"; color: var(--dim); }
  .chip {
    display: inline-block; padding: 2px 8px; margin: 0 4px 4px 0; border-radius: 10px;
    background: #2d2410; border: 1px solid var(--warn); color: var(--warn); font-size: 11px;
  }
  #blocks td:first-child { color: var(--ink); }
  .stale { opacity: .45; }
  code { color: var(--accent); }

  /* A board that stopped updating looks exactly like a working one, so when the reason is
     something a human can fix in a minute - an empty OpenAI account - it gets said loudly
     and in the middle of the screen, not logged to a console nobody has open. */
  #alert {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 12px 16px; display: none;
    background: #3d1618; border-bottom: 2px solid var(--bad); color: #ffd7d5;
    font-size: 12px; line-height: 1.6;
  }
  #alert.show { display: block; }
  #alert.warn { background: #33280c; border-bottom-color: var(--warn); color: #f2e2b8; }
  #alert b { color: #fff; display: block; font-size: 13px; margin-bottom: 2px; }
  #alert a { color: var(--accent); }
  #alert .what { color: #e8b4b1; }
  #alert.warn .what { color: #d8c79a; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="alert"></div>
  <div id="badge">
    <span id="conn" class="off">connecting</span> &nbsp;·&nbsp;
    seq <b id="seq">0</b> &nbsp;·&nbsp; <b id="rate">0</b> Hz &nbsp;·&nbsp;
    rtt <b id="rtt">–</b> ms &nbsp;·&nbsp; <span id="script">–</span>
  </div>
</div>

<aside>
  <h1>Mock Roblox</h1>
  <p class="sub">
    Stand-in for the Roblox client. Speaks the same protocol over the same WebSocket, so
    whatever renders here is what a Studio script receives.
  </p>

  <h2>Link</h2>
  <table id="link"></table>

  <h2>Board</h2>
  <table id="board"></table>

  <h2>Blocks</h2>
  <table id="blocks"></table>

  <h2>Active effects</h2>
  <div id="active"></div>

  <h2>Send an event to the arm</h2>
  <div id="buttons"></div>
  <button id="kill">clear all effects <span>kill</span></button>

  <h2>Mapping</h2>
  <table id="map"></table>
</aside>

<script>
// ---------------------------------------------------------------------------
// The mm -> studs conversion a Roblox script would do. Sheet frame is +x right,
// +y down the page, +z up. Roblox is Y-up, so sheet y becomes Roblox Z.
// One scale on all three axes, matching roblox/Mapping.lua.
// ---------------------------------------------------------------------------
let SCALE = 0.46;       // studs per mm, all three axes

// Must match roblox/Mapping.lua's blockPosition, or this panel lies about what Studio got.
// It drifted once already: height here was `level * 6.5` while Mapping had moved to one cube
// per level, so the viewer reported a Y the game never used. One scale applies to every axis,
// so a stack level is exactly one cube tall.
const toRoblox = (b, cube) => {
  const w = cube * SCALE;             // a cube is a true cube: 48 mm -> ~22 studs
  return {
    X: +(b.x * SCALE).toFixed(1),
    Z: +(b.y * SCALE).toFixed(1),
    Y: +(b.level * w + w / 2).toFixed(1),
  };
};

const COLORS = {
  red: "#e5484d", orange: "#f76b15", yellow: "#ffe629", green: "#46a758",
  teal: "#12a594", "light blue": "#5eb0ef", blue: "#3e63dd", purple: "#8e4ec6",
  pink: "#e93d82",
};

// ---------------------------------------------------------------------------
// Isometric projection. No 3D library: this has to work on a demo laptop with
// no internet, and a hand-rolled projection is ~20 lines.
// ---------------------------------------------------------------------------
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const COS = Math.cos(Math.PI / 6), SIN = Math.sin(Math.PI / 6);
let view = { s: 1.6, cx: 0, cy: 0 };

function project(x, y, z) {
  return [
    view.cx + (x - y) * COS * view.s,
    view.cy + (x + y) * SIN * view.s - z * view.s,
  ];
}
const depth = (x, y) => x + y;   // bigger = nearer the viewer, so drawn later

function resize() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  view.s = Math.min(r.width / 560, r.height / 420);
  view.cx = r.width / 2;
  view.cy = r.height / 2 - 150 * view.s;
}
addEventListener("resize", resize);

// ---------------------------------------------------------------------------
// Drawing
// ---------------------------------------------------------------------------
function poly(pts, fill, stroke, width = 1) {
  ctx.beginPath();
  pts.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = width; ctx.stroke(); }
}

// The sheet and its grid, both taken from the hello frame.
//
// This used to hardcode a 3x3 grid and the portrait sheet it came on, so after the sheet was
// regenerated as a 3x4 landscape one the viewer still drew nine cells labelled A1..C3 - and
// blocks the server correctly reported in column 4 landed outside the drawn grid entirely.
// The hello frame has carried `grid.rows` and `grid.cols` the whole time; the fallbacks below
// are only for the moments before it arrives.
function drawSheet(space) {
  const W = space?.sheet?.w_mm ?? 279.4, H = space?.sheet?.h_mm ?? 215.9;
  poly([project(0, 0, 0), project(W, 0, 0), project(W, H, 0), project(0, H, 0)],
       "#1b2130", "#39445a", 1.5);

  const g = space?.grid;
  if (!g) return;
  const [ox, oy] = g.origin_mm, c = g.cell_mm;
  const rows = g.rows ?? ["A", "B", "C"], cols = g.cols ?? [1, 2, 3];
  const nR = rows.length, nC = cols.length;

  ctx.strokeStyle = "#2f3a4a";
  ctx.lineWidth = 1;
  for (let i = 0; i <= nC; i++) {          // column lines, full height
    const a = project(ox + i * c, oy, 0), b = project(ox + i * c, oy + nR * c, 0);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }
  for (let j = 0; j <= nR; j++) {          // row lines, full width
    const a = project(ox, oy + j * c, 0), b = project(ox + nC * c, oy + j * c, 0);
    ctx.beginPath(); ctx.moveTo(...a); ctx.lineTo(...b); ctx.stroke();
  }

  // The same labels that are printed on the paper, which is what the vision model reads.
  ctx.fillStyle = "#54607a"; ctx.font = "11px ui-monospace";
  for (let r = 0; r < nR; r++) for (let col = 0; col < nC; col++) {
    const p = project(ox + (col + .5) * c, oy + (r + .5) * c, 0);
    ctx.fillText(String(rows[r]) + String(cols[col]), p[0] - 7, p[1] + 4);
  }
}

function drawCube(b, cube) {
  const h = cube, half = cube / 2;
  const x0 = b.x - half, x1 = b.x + half, y0 = b.y - half, y1 = b.y + half;
  // Height is always the stack level: nothing is tracked mid-carry, so there is no carried
  // block at some in-between height to draw any more.
  const z0 = b.level * cube, z1 = z0 + h;
  const base = COLORS[b.color] || "#9aa4b2";
  const a = ctx.globalAlpha;

  // Only three faces of a cube are ever visible in this projection.
  poly([project(x0, y1, z0), project(x1, y1, z0), project(x1, y1, z1), project(x0, y1, z1)],
       shade(base, -0.35), "#00000055");
  poly([project(x1, y0, z0), project(x1, y1, z0), project(x1, y1, z1), project(x1, y0, z1)],
       shade(base, -0.18), "#00000055");
  poly([project(x0, y0, z1), project(x1, y0, z1), project(x1, y1, z1), project(x0, y1, z1)],
       base, "#00000055", 1);

  // A dropped dashed line to the paper used to be drawn under a carried block, to make its
  // height read at a glance. Blocks only ever rest in a cell now, so there is no height to
  // explain: a level-1 block is plainly sitting on the level-0 one beneath it.
  ctx.globalAlpha = a;
}

function shade(hex, k) {
  const n = parseInt(hex.slice(1), 16);
  const f = (v) => Math.max(0, Math.min(255, Math.round(v + 255 * k)));
  return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`;
}

function drawArm(arm) {
  const pts = arm.points.map((p) => project(p.x, p.y, p.z));

  // Shadow on the paper first: it is the cue that sells the height.
  ctx.strokeStyle = "#00000066"; ctx.lineWidth = 6; ctx.lineCap = "round";
  ctx.beginPath();
  arm.points.forEach((p, i) => {
    const q = project(p.x, p.y, 0);
    i ? ctx.lineTo(...q) : ctx.moveTo(...q);
  });
  ctx.stroke();

  ctx.strokeStyle = "#7d8da3"; ctx.lineWidth = 9;
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p)));
  ctx.stroke();
  ctx.strokeStyle = "#cfd8e3"; ctx.lineWidth = 4;
  ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(...p) : ctx.moveTo(...p)));
  ctx.stroke();

  pts.forEach(([x, y], i) => {
    const last = i === pts.length - 1;
    ctx.beginPath(); ctx.arc(x, y, last ? 6 : 5, 0, 7);
    ctx.fillStyle = last ? "#4da3ff" : "#9fb0c6"; ctx.fill();
  });
}

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------
let hello = null, state = null, frames = 0, rate = 0, rtt = null, pingAt = 0, pingId = 1;
setInterval(() => { rate = frames; frames = 0; }, 1000);

function frame() {
  resizeIfNeeded();
  const r = cv.getBoundingClientRect();
  ctx.clearRect(0, 0, r.width, r.height);
  drawSheet(hello?.space);

  if (state) {
    const cube = hello?.space?.cube_mm ?? 48;
    const arm = state.arm;
    const items = [];
    (state.blocks || []).forEach((b) => items.push({ d: depth(b.x, b.y), draw: () => drawCube(b, cube) }));
    if (arm?.points?.length) {
      const tip = arm.tip;
      items.push({ d: depth(tip.x, tip.y) + 1, draw: () => drawArm(arm) });
    }
    items.sort((a, b) => a.d - b.d).forEach((i) => i.draw());
  }
  requestAnimationFrame(frame);
}

let lastW = 0, lastH = 0;
function resizeIfNeeded() {
  const r = cv.getBoundingClientRect();
  if (r.width !== lastW || r.height !== lastH) { lastW = r.width; lastH = r.height; resize(); }
}

const row = (k, v, cls = "") => `<tr class="${cls}"><td>${k}</td><td>${v}</td></tr>`;

// ---------------------------------------------------------------------------
// The board, and why it is or is not updating.
//
// Blocks no longer arrive ten times a second: a vision model reads the printed grid two
// seconds after the gripper opens, and the same board is republished until the next read. So
// a block list tens of seconds old is healthy, and "blocks age" is no longer a fault light.
//
// What IS a fault is the read itself failing, and the failure worth shouting about is an
// OpenAI account with no credits left - the one cause a human can clear in a minute, and the
// one that is otherwise indistinguishable from a dead camera. Hence a banner across the
// stage rather than a line in a console nobody has open.
// ---------------------------------------------------------------------------
const ALERTS = {
  no_credits: {
    level: "bad",
    title: "OpenAI credits exhausted — the board has stopped updating",
    what: "The arm and the Sky Arm are unaffected. Blocks are frozen at the last board that was read successfully.",
    fix: "Add credits, then release a block (or just wait ~20 s) — the read retries on its own.",
  },
  no_key: {
    level: "bad",
    title: "No OpenAI API key — the board cannot be read",
    what: "Blocks will stay empty for the whole session.",
    fix: "Put OPENAI_API_KEY in the environment or in a .env at the repo root, then restart the bridge.",
  },
  auth: {
    level: "bad",
    title: "OpenAI rejected the API key",
    what: "Blocks are frozen at the last board that was read successfully.",
    fix: "Check OPENAI_API_KEY, then restart the bridge.",
  },
  rate_limit: {
    level: "warn",
    title: "Rate-limited by OpenAI — the board is behind",
    what: "This clears on its own; the read retries in about 20 seconds.",
  },
  error: {
    level: "warn",
    title: "The board read failed",
    what: "Usually the camera. The read retries in about 20 seconds.",
  },
};

function board(st, h) {
  const b = st?.notes?.board;
  const el = document.getElementById("alert");
  const a = b && ALERTS[b.state];

  if (a) {
    el.className = "show" + (a.level === "warn" ? " warn" : "");
    el.innerHTML =
      `<b>${a.title}</b>` +
      `<span class="what">${a.what}</span>` +
      (b.message ? `<br><span class="what">${b.message}</span>` : "") +
      (a.fix ? `<br>${a.fix}` : "") +
      (b.url ? ` <a href="${b.url}" target="_blank" rel="noreferrer">${b.url}</a>` : "");
  } else {
    el.className = "";
  }

  const dash = "–";
  const reader = b?.model ?? h?.board?.reader;
  const since = b?.since_read;
  document.getElementById("board").innerHTML =
    row("reader", reader ?? "<span style='color:var(--dim)'>not reading</span>") +
    row("state", b?.state
      ? `<span class="${b.state === "ok" ? "on" : b.state === "reading" ? "" : "off"}">${b.state}</span>`
      : dash) +
    row("reads", b?.reads ?? dash) +
    row("last read", since == null ? dash : since.toFixed(0) + " s ago") +
    row("trigger", b?.trigger ?? h?.board?.trigger ?? dash) +
    row("cells", b?.cells ?? dash) +
    (b?.clamped ? row("<span style='color:var(--warn)'>over-tall</span>",
                      b.clamped.join(", ")) : "");
}

function paint() {
  const st = state, sp = hello?.space;
  document.getElementById("seq").textContent = st?.seq ?? 0;
  document.getElementById("rate").textContent = rate;
  document.getElementById("rtt").textContent = rtt === null ? "–" : rtt;
  document.getElementById("script").textContent = st?.notes?.script ?? hello?.source ?? "–";

  const armAge = st?.arm_age, blkAge = st?.blocks_age;
  document.getElementById("link").innerHTML =
    row("source", hello?.source ?? "–") +
    row("protocol", "v" + (hello?.v ?? "?")) +
    row("arm age", armAge == null ? "–" : armAge.toFixed(2) + " s", armAge > 0.5 ? "stale" : "") +
    row("blocks age", blkAge == null ? "–" : blkAge.toFixed(2) + " s") +
    row("gripper", st?.arm?.joints?.gripper?.toFixed(1) ?? "–") +
    row("tip z", st?.arm?.tip ? st.arm.tip.z.toFixed(0) + " mm" : "–");

  document.getElementById("blocks").innerHTML = (st?.blocks || []).map((b) => {
    const r = toRoblox(b, sp?.cube_mm ?? 48);
    // Blocks are read in cells now, so the cell is the useful label, and there is no held or
    // lost state left to show: the board is whatever the last read said until the next one.
    return row(`#${b.id} ${b.color}`,
               `${b.cell ?? "?"} · L${b.level} · ${r.X},${r.Y},${r.Z}`);
  }).join("") || row("<span style='color:var(--dim)'>board is empty</span>", "");

  board(st, hello);

  document.getElementById("active").innerHTML = (st?.effects || [])
    .map((e) => `<span class="chip">${e.name} ${e.intensity} · ${e.remaining}s</span>`).join("");

  document.getElementById("map").innerHTML =
    row("studs / mm", SCALE) +
    row("studs / level", sp ? (sp.cube_mm * SCALE).toFixed(1) : "\u2013") +
    row("sheet", sp ? `${(sp.sheet.w_mm * SCALE).toFixed(0)} × ${(sp.sheet.h_mm * SCALE).toFixed(0)} studs` : "–") +
    row("cube", sp ? `${(sp.cube_mm * SCALE).toFixed(1)} studs wide` : "–") +
    row("arm base", sp ? sp.arm_base_mm.join(", ") + " mm" : "–");
}
setInterval(paint, 100);

// ---------------------------------------------------------------------------
// The link. Exactly what a Roblox script does, in JS.
// ---------------------------------------------------------------------------
const port = new URLSearchParams(location.search).get("ws") || 8765;
let ws = null;

function connect() {
  ws = new WebSocket(`ws://${location.hostname}:${port}`);
  const conn = document.getElementById("conn");

  ws.onopen = () => {
    conn.textContent = "connected"; conn.className = "on";
    setInterval(() => {
      if (ws?.readyState === 1) { pingAt = performance.now(); ws.send(JSON.stringify({ t: "ping", id: pingId++ })); }
    }, 2000);
  };
  ws.onclose = () => {
    conn.textContent = "disconnected"; conn.className = "off";
    hello = null; state = null;
    setTimeout(connect, 1000);     // the robot process restarts a lot during a hackathon
  };
  ws.onmessage = (ev) => {
    const f = JSON.parse(ev.data);
    if (f.t === "state") { state = f; frames++; }
    else if (f.t === "hello") { hello = f; onHello(f); }
    else if (f.t === "pong") { rtt = Math.round(performance.now() - pingAt); }
    else if (f.t === "error") { console.warn("server:", f.message, f.frame ?? ""); }
  };
}

// Effect buttons are built from the server's own list, so adding an effect in
// bridge/effects.py makes a button appear here with no edit to this file.
const PRESET = {
  earthquake: { intensity: 0.7, duration: 4 }, fog: { intensity: 0.6, duration: 5 },
  mirror: { intensity: 1.0, duration: 6 }, molasses: { intensity: 0.8, duration: 5 },
  butterfingers: { intensity: 1.0, duration: 4 }, freeze: { intensity: 1.0, duration: 2.5 },
};

function onHello(f) {
  const box = document.getElementById("buttons");
  box.innerHTML = "";
  (f.effects || []).forEach((name) => {
    const p = PRESET[name] || { intensity: 1, duration: 3 };
    const b = document.createElement("button");
    b.innerHTML = `${name}<span>${p.intensity} · ${p.duration}s</span>`;
    b.onclick = () => ws.send(JSON.stringify({ t: "event", name, ...p }));
    box.appendChild(b);
  });
}

document.getElementById("kill").onclick = () =>
  (hello?.effects || []).forEach((name) =>
    ws.send(JSON.stringify({ t: "event", name, intensity: 0, duration: 0 })));

resize();
connect();
frame();
</script>
</body>
</html>
